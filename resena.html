<section id="valoraciones">
    <h2 style="text-align:center; color:#0b4a8b; margin-bottom:25px;">
        ⭐ Valora nuestro servicio
    </h2>

    <form class="review-form" action="#" method="POST">

        <input type="text"
               name="nombre_cliente"
               placeholder="Nombre o Empresa"
               required>

        <select name="puntuacion" required>
            <option value="">Selecciona una valoración</option>
            <option value="5">⭐⭐⭐⭐⭐ Excelente</option>
            <option value="4">⭐⭐⭐⭐ Muy buena</option>
            <option value="3">⭐⭐⭐ Buena</option>
            <option value="2">⭐⭐ Mejorable</option>
            <option value="1">⭐ Mala</option>
        </select>

        <textarea
            name="comentario"
            rows="5"
            placeholder="Cuéntanos tu experiencia con MAI Asesoría..."
            required></textarea>

        <button type="submit">
            Enviar valoración
        </button>

    </form>
</section>
